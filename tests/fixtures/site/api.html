<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Fixture: API call</title></head>
<body>
  <button type="button" id="save">Save</button>
  <p id="status"></p>
  <script>
    document.getElementById('save').onclick = async () => {
      const response = await fetch('/api/save', { method: 'POST' });
      document.getElementById('status').textContent = response.status === 201 ? 'Saved' : 'Error';
    };
  </script>
</body></html>
