<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: classic login</title>
    <style>
      body { font: 16px system-ui, sans-serif; max-width: 420px; margin: 40px auto; }
      label { display: block; margin: 10px 0 4px; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <p class="error" id="error" hidden>Wrong email or password.</p>
    <!-- A plain server-rendered form: submitting loads a new page. -->
    <form method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Choose…</option>
        <option value="bd">Bangladesh</option>
        <option value="us">United States</option>
      </select>
      <label><input type="checkbox" name="remember" /> Remember me</label>
      <p><button type="submit">Sign in</button> <button type="button">Forgot password?</button></p>
    </form>
    <script>
      if (new URLSearchParams(location.search).has('error')) document.getElementById('error').hidden = false;
    </script>
  </body>
</html>
