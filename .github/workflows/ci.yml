name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The unit tests, with a coverage report (no threshold yet).
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - run: npm run learn:check
      - run: npm run guide:check
      - run: npm run wiki:check
      - run: npm run build
      - run: npm run build:firefox
      # Safari: builds without the APIs Safari lacks (docs/SAFARI.md); the Mac check is manual.
      - run: npm run build:safari

  # The extension in a real Chromium (tests/e2e). New headless supports extensions; xvfb-run is the
  # fallback display. The GitHub mirror only receives main, so there this runs after a merge.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: npm run e2e
        run: |
          export BF_BROWSER="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          BF_HEADLESS=1 xvfb-run -a npm run e2e

  e2e-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest ships Firefox; the runner drives it headless over WebDriver BiDi.
      - run: firefox --version
      - run: npm run e2e:firefox

  # M4: the CLI runner (packages/cli) on the automation build: validate the guide examples (they target
  # live sites, so they are validated, not run) and run fixture workflows end to end through the bridge.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:automation
      - name: blockflow validate + CLI e2e
        run: |
          export BLOCKFLOW_BROWSER="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run blockflow -- validate docs/guide/examples
          node tests/cli/cli.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-report
          path: blockflow-report/
          if-no-files-found: ignore
