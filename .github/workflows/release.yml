name: Release

# Push a tag like v1.0.0 (or publish a release in the GitHub UI, which creates the tag). Builds, checks and zips
# both stores' packages, lints Firefox, attaches the zips to the GitHub release, and (only when the secrets exist)
# signs the Firefox build and uploads the Chrome package as a draft. A person publishes in the store dashboards.
# Pre-release tags (v1.0.0-alpha, v1.0.0-rc.1): the part before "-" must equal package.json (extension manifests
# allow only numeric versions), the GitHub release is marked pre-release, and nothing goes to the stores.
# After that, the `npm` job publishes the npm packages whose version is not on npmjs.com yet (trusted publishing,
# no token: each package names this workflow file as its trusted publisher on npmjs.com).
# See docs/store/README.md.
on:
  push:
    tags: ['v*.*.*']
  # Actions → Release → "Run workflow": only the npm job, on the chosen branch (default main). For a package fix
  # without a new extension version; same workflow file, so the npm trusted publisher accepts it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    # Job-level, because a step's `if` cannot see its own step-level `env`. Empty when the secret is not set.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: The tag must match package.json
        id: tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          version="$(node -p "require('./package.json').version")"
          if [ "$base" != "$version" ]; then echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; fi
          if [ "$base" != "$tag" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: npm run check
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run lint:firefox
      - run: npm run zip
      - run: npm run zip:firefox
      - run: ls -l .output/*.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: .output/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
      - name: Submit the Firefox version to AMO (needs AMO_JWT_ISSUER and AMO_JWT_SECRET)
        # A store error (e.g. this version was already submitted, on a re-run) shows in the log but does not stop
        # the npm job.
        continue-on-error: true
        if: ${{ steps.tag.outputs.prerelease == 'false' && env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        # Submits a new version of the listed add-on with the sources zip (the code is bundled) and the reviewer
        # notes + licence from docs/store/amo-metadata.json. Does not wait for Mozilla's review (it can take days):
        # AMO publishes the version when a reviewer approves it.
        run: |
          version="$(node -p "require('./package.json').version")"
          npx web-ext sign --source-dir .output/firefox-mv3 --channel listed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --upload-source-code ".output/blockflow-$version-sources.zip" \
            --amo-metadata docs/store/amo-metadata.json \
            --approval-timeout 0 --artifacts-dir .output/signed
      - name: Upload the Chrome package as a draft (needs the CWS_* secrets)
        # A store error (e.g. this version was already submitted, on a re-run) shows in the log but does not stop
        # the npm job.
        continue-on-error: true
        if: ${{ steps.tag.outputs.prerelease == 'false' && env.CWS_CLIENT_ID != '' && env.CWS_CLIENT_SECRET != '' && env.CWS_REFRESH_TOKEN != '' && env.CWS_EXTENSION_ID != '' }}
        run: |
          zip="$(ls .output/*-chrome.zip | head -1)"
          npx --yes chrome-webstore-upload-cli@3 upload --source "$zip" --extension-id "$CWS_EXTENSION_ID" --client-id "$CWS_CLIENT_ID" --client-secret "$CWS_CLIENT_SECRET" --refresh-token "$CWS_REFRESH_TOKEN"

  # npm trusted publishing (OIDC): npmjs.com accepts a publish from this workflow file in akibh-dev/blockflow
  # without a token, and adds provenance. Each package publishes only when its version is not on npm yet, so a
  # tag that only changes the extension publishes nothing. Pre-release tags skip npm. Setup: docs/wiki/Build-and-Release.md.
  npm:
    needs: release
    # After a successful tag release (not a pre-release), or on its own when started by hand.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.release.result == 'success' && needs.release.outputs.prerelease == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Started by hand: the checks the release job would have run.
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run check
      # blockflow-runner bundles this build (packages/cli/scripts/pack.mjs runs at prepack).
      - run: npm run build:automation
      - name: Publish new package versions (bridge first; mcp and runner depend on it)
        run: |
          for dir in bridge mcp cli; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipped"
            else
              echo "publishing $name@$version"
              (cd "packages/$dir" && npm publish --access public)
            fi
          done
